[project]
name = "identity-service-fastapi"
version = "0.1.0"
description = "Identity Service desenvolvido com FastAPI."
authors = [
    {name = "Lucas Oliveira",email = "blesslucas89@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard] (>=0.52.0,<0.53.0)",
    "typing-extensions (>=4.16.0,<5.0.0)",
    "tortoise-orm (>=1.1.7,<2.0.0)",
    "aerich (>=0.9.3,<0.10.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "bcrypt==4.0.1",
    "aiosmtplib (>=5.1.2,<6.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.1,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.12.0,<1.0.0)"
]

[tool.tortoise]
tortoise_orm = "src.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "N",
    "UP",
    "SIM",
    "PL",
]

ignore = [
    "EXE",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
]