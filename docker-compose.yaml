services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: identity-api

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - /app/.venv

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: >
      sh -c "poetry run aerich upgrade &&
             poetry run uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

    restart: unless-stopped

  postgres:
    image: postgres:17

    container_name: identity-postgres

    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  redis:
    image: redis:7

    container_name: identity-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest

    container_name: identity-mailpit

    ports:
      - "1025:1025"
      - "8025:8025"

    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
